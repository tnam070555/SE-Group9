<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mua vé tham quan – Dinh Độc Lập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Be Vietnam Pro"', 'sans-serif'] },
      colors: { heritage: { red: '#8B1E24', redDeep: '#5E1216', gold: '#C9A227', goldSoft: '#E8D9A6', paper: '#F7F3EA', ink: '#2A2320', brown: '#6B5443' } }
    } } };
  </script>
  <style>
    body { background: #F7F3EA; background-image: radial-gradient(circle at 1px 1px, rgba(139,30,36,.06) 1px, transparent 0); background-size: 22px 22px; }
    .gold-rule { background: linear-gradient(90deg, transparent, #C9A227, transparent); height: 2px; }
    .slot-on[aria-pressed="true"] { background: #8B1E24; color: #fff; border-color: #8B1E24; }
    .slot-on[aria-pressed="true"] .seats { color: #E8D9A6; }
    .demo-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); border: 3px solid rgba(139,30,36,.55); color: rgba(139,30,36,.7); background: rgba(255,255,255,.75); font-weight: 800; letter-spacing: .15em; padding: 2px 10px; border-radius: 6px; font-size: 14px; pointer-events: none; }
    @media print { header, footer, .no-print { display: none !important; } body { background: #fff; } .ticket { break-inside: avoid; border: 1px solid #000 !important; } }
  </style>
</head>
<body class="font-sans text-heritage-ink antialiased">

  <header class="sticky top-0 z-40 bg-heritage-paper/95 backdrop-blur border-b border-heritage-gold/40 no-print">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full border-2 border-heritage-red text-heritage-red bg-white flex items-center justify-center shadow-sm"><i class="fa-solid fa-landmark"></i></div>
        <div>
          <p class="font-serif font-bold text-lg leading-tight text-heritage-red uppercase tracking-wide">Dinh Độc Lập</p>
          <p class="text-xs text-heritage-brown" id="brandSub">Mua vé tham quan</p>
        </div>
      </a>
      <div class="flex items-center gap-2" id="langBar"></div>
    </div>
    <div class="gold-rule"></div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
    <div id="booking">
      <h1 class="font-serif text-3xl sm:text-4xl font-bold text-heritage-red mb-2" id="pageTitle"></h1>
      <p class="text-heritage-brown mb-8" id="pageDesc"></p>

      <!-- Bước 1: ngày -->
      <section class="bg-white rounded-2xl border border-heritage-gold/30 shadow-sm p-6 mb-6" id="step1">
        <div class="flex items-center gap-3 mb-4">
          <span class="w-8 h-8 rounded-full bg-heritage-red text-white flex items-center justify-center font-bold text-sm">1</span>
          <h2 class="font-serif text-xl font-bold text-heritage-red" id="h1"></h2>
        </div>
        <input id="date" type="date" class="w-full sm:w-72 px-4 py-2.5 rounded-xl border border-heritage-brown/25 bg-white focus:outline-none focus:border-heritage-gold">
        <p class="text-sm text-heritage-brown mt-3" id="hours"></p>
      </section>

      <!-- Bước 2: khung giờ -->
      <section class="bg-white rounded-2xl border border-heritage-gold/30 shadow-sm p-6 mb-6 hidden" id="step2">
        <div class="flex items-center gap-3 mb-4">
          <span class="w-8 h-8 rounded-full bg-heritage-red text-white flex items-center justify-center font-bold text-sm">2</span>
          <h2 class="font-serif text-xl font-bold text-heritage-red" id="h2"></h2>
        </div>
        <p id="slotStatus" class="text-sm text-heritage-brown mb-3 hidden"></p>
        <div id="slots" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
      </section>

      <!-- Bước 3: số lượng + thông tin liên hệ -->
      <section class="bg-white rounded-2xl border border-heritage-gold/30 shadow-sm p-6 mb-6 hidden" id="step3">
        <div class="flex items-center gap-3 mb-4">
          <span class="w-8 h-8 rounded-full bg-heritage-red text-white flex items-center justify-center font-bold text-sm">3</span>
          <h2 class="font-serif text-xl font-bold text-heritage-red" id="h3"></h2>
        </div>
        <div id="types" class="divide-y divide-heritage-brown/10"></div>

        <div class="grid sm:grid-cols-2 gap-4 mt-6 pt-5 border-t border-heritage-brown/10">
          <label class="block">
            <span class="block text-sm font-medium text-heritage-ink mb-1.5" id="nameLabel"></span>
            <input id="contactName" type="text" maxlength="100" autocomplete="name" class="w-full px-4 py-2.5 rounded-xl border border-heritage-brown/25 focus:outline-none focus:border-heritage-gold">
          </label>
          <label class="block">
            <span class="block text-sm font-medium text-heritage-ink mb-1.5" id="phoneLabel"></span>
            <input id="contactPhone" type="tel" maxlength="20" autocomplete="tel" class="w-full px-4 py-2.5 rounded-xl border border-heritage-brown/25 focus:outline-none focus:border-heritage-gold">
          </label>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 mt-6 pt-5 border-t border-heritage-gold/40">
          <div>
            <p class="text-sm text-heritage-brown" id="totalQtyLabel"></p>
            <p class="font-serif text-2xl font-bold text-heritage-red" id="total">0 đ</p>
          </div>
          <button id="submitBtn" type="button" class="bg-heritage-red hover:bg-heritage-redDeep disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold px-7 py-3 rounded-xl shadow transition"></button>
        </div>
        <p id="orderError" class="text-sm text-red-700 mt-3 hidden" role="alert"></p>
      </section>
    </div>

    <!-- Bước 4: thanh toán bằng mã QR -->
    <section class="hidden" id="payment">
      <div class="bg-white rounded-2xl border border-heritage-gold/40 shadow-sm overflow-hidden">
        <div class="bg-heritage-red text-white px-6 py-4 flex flex-wrap items-center justify-between gap-2">
          <h2 class="font-serif text-xl font-bold" id="payTitle"></h2>
          <span class="text-sm text-heritage-goldSoft" id="payCountdown" aria-live="polite"></span>
        </div>
        <div class="p-6 grid md:grid-cols-[auto,1fr] gap-8 items-start">
          <div class="mx-auto text-center">
            <div class="relative inline-block bg-white p-3 rounded-xl border-2 border-heritage-gold">
              <img id="payQr" alt="" class="w-56 h-56 sm:w-64 sm:h-64">
              <span class="demo-stamp">DEMO</span>
            </div>
            <p class="text-xs text-heritage-brown mt-2 max-w-[16rem]" id="payDemoNote"></p>
          </div>
          <div class="space-y-4">
            <dl class="grid grid-cols-[auto,1fr] gap-x-4 gap-y-2 text-sm">
              <dt class="text-heritage-brown" id="payAmountLabel"></dt>
              <dd class="font-serif text-2xl font-bold text-heritage-red" id="payAmount"></dd>
              <dt class="text-heritage-brown" id="payContentLabel"></dt>
              <dd class="flex items-center gap-2">
                <span class="font-mono font-bold text-lg tracking-wider" id="payContent"></span>
                <button type="button" id="copyBtn" class="text-xs border border-heritage-brown/30 hover:border-heritage-red rounded-md px-2 py-1"><i class="fa-regular fa-copy"></i> <span id="copyText"></span></button>
              </dd>
              <dt class="text-heritage-brown" id="payVisitLabel"></dt>
              <dd id="payVisit"></dd>
              <dt class="text-heritage-brown" id="payItemsLabel"></dt>
              <dd id="payItems"></dd>
            </dl>
            <ol class="list-decimal list-inside text-sm text-heritage-ink space-y-1 bg-heritage-paper rounded-xl p-4" id="paySteps"></ol>
            <div id="payState" class="flex items-center gap-3 rounded-xl border px-4 py-3 text-sm" role="status" aria-live="polite"></div>
            <div class="flex flex-wrap gap-3">
              <button type="button" id="payNewBtn" class="no-print text-sm font-semibold text-heritage-red underline underline-offset-4"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Kết quả: vé có mã QR vào cổng -->
    <section class="hidden" id="result">
      <div class="bg-heritage-paper border border-heritage-gold/50 rounded-2xl p-6 mb-6 text-center">
        <i class="fa-solid fa-circle-check text-3xl text-green-700 mb-2"></i>
        <h2 class="font-serif text-2xl font-bold text-heritage-red" id="resultTitle"></h2>
        <p class="text-sm text-heritage-brown mt-2" id="resultNote"></p>
        <!-- Vé chỉ hiện trong 60 giây sau khi thanh toán -->
        <p id="viewTimer" class="hidden no-print mt-4 inline-flex items-center gap-2 rounded-full bg-heritage-red text-white text-sm font-semibold px-4 py-2" role="timer" aria-live="polite"></p>
        <br>
        <button id="printBtn" class="no-print mt-4 border border-heritage-brown/30 hover:border-heritage-red text-heritage-brown px-5 py-2 rounded-lg text-sm"><i class="fa-solid fa-print"></i> <span id="printText"></span></button>
      </div>
      <div id="tickets" class="grid sm:grid-cols-2 gap-6"></div>
      <!-- Hết thời gian xem vé -->
      <div id="viewExpired" class="hidden bg-white border border-heritage-gold/50 rounded-2xl p-6 text-center">
        <i class="fa-solid fa-eye-slash text-3xl text-heritage-brown mb-2"></i>
        <h2 class="font-serif text-xl font-bold text-heritage-red" id="viewExpiredTitle"></h2>
        <p class="text-sm text-heritage-brown mt-2 max-w-lg mx-auto" id="viewExpiredNote"></p>
      </div>
      <button id="newBtn" class="no-print mt-8 text-sm font-semibold text-heritage-red underline underline-offset-4"></button>
    </section>

    <!-- Tra cứu vé đã đặt -->
    <section class="mt-12 no-print bg-white rounded-2xl border border-heritage-gold/30 p-6" id="lookup">
      <h2 class="font-serif text-xl font-bold text-heritage-red mb-1" id="lookupTitle"></h2>
      <p class="text-sm text-heritage-brown mb-4" id="lookupDesc"></p>
      <form id="lookupForm" class="flex flex-wrap gap-3">
        <input id="lookupCode" type="text" maxlength="40" placeholder="TKT-..." class="flex-1 min-w-[12rem] px-4 py-2.5 rounded-xl border border-heritage-brown/25 font-mono uppercase focus:outline-none focus:border-heritage-gold">
        <button class="bg-heritage-brown hover:bg-heritage-ink text-white font-semibold px-5 py-2.5 rounded-xl" id="lookupBtn" type="submit"></button>
      </form>
      <p id="lookupMsg" class="text-sm mt-3 hidden"></p>
    </section>
  </main>

  <footer class="bg-heritage-redDeep text-heritage-paper/70 text-center text-xs py-6 mt-12 no-print" id="footer"></footer>

  <script src="js/common.js"></script>
  <script>
    // ---------- Chữ giao diện (vi, en; ngôn ngữ khác dùng tiếng Việt) ----------
    const STR = {
      vi: { brandSub: 'Mua vé tham quan', title: 'Mua vé tham quan', desc: 'Chọn ngày, khung giờ và số lượng vé, sau đó quét mã QR để thanh toán. Vé điện tử có hiệu lực ngay khi thanh toán được xác nhận.',
        h1: 'Chọn ngày tham quan', h2: 'Chọn khung giờ', h3: 'Chọn số lượng vé', hours: 'Mở cửa 07:30 – 16:30, cả 7 ngày trong tuần, kể cả Lễ, Tết.',
        loadingSlots: 'Đang tải khung giờ...', noSlots: 'Không tải được khung giờ', seats: (n) => `còn ${n} chỗ`, full: 'Hết chỗ', past: 'Đã qua',
        pickSlot: 'Hãy chọn một khung giờ trước.', seatsLeft: (n) => `còn ${n} chỗ trong khung giờ này`, totalQty: (n) => `Tổng cộng ${n} vé`,
        nameLabel: 'Họ tên (không bắt buộc)', phoneLabel: 'Số điện thoại (không bắt buộc)',
        submit: 'Tiếp tục thanh toán', submitFree: 'Nhận vé', submitting: 'Đang tạo đơn...', chooseAtLeast: 'Chọn ít nhất 1 vé',
        payTitle: 'Quét mã QR để thanh toán', payLeft: (m) => `Giữ chỗ còn ${m}`, payAmount: 'Số tiền', payContent: 'Nội dung chuyển khoản', copy: 'Chép', copied: 'Đã chép',
        payVisit: 'Thời gian tham quan', payItems: 'Vé', payDemoNote: 'Mã QR minh họa cho đồ án, không chuyển tiền thật.',
        paySteps: ['Mở ứng dụng ngân hàng hoặc ví điện tử và quét mã QR.', 'Kiểm tra đúng số tiền và nội dung chuyển khoản là mã đơn.', 'Giữ trang này mở. Khi nhân viên xác nhận đã nhận tiền, vé điện tử sẽ tự hiện ra.'],
        waiting: 'Đang chờ nhân viên xác nhận thanh toán...', expired: 'Đơn đã quá hạn thanh toán và bị hủy. Chỗ đã được trả lại, vui lòng đặt lại.',
        cancelled: 'Đơn đã bị hủy. Nếu bạn đã chuyển khoản, vui lòng liên hệ quầy vé.', payNew: 'Đặt đơn khác',
        ok: 'Thanh toán thành công – vé của bạn đây', okNote: 'Xuất trình mã QR tại cổng. Mỗi vé chỉ dùng được một lần, đúng khung giờ đã chọn. Nên chụp màn hình hoặc in vé.', print: 'In vé', newOrder: 'Mua thêm vé',
        viewLeft: (s) => `Vé chỉ hiển thị thêm ${s} giây – hãy chụp màn hình hoặc ghi lại mã vé`,
        viewExpiredTitle: 'Đã hết thời gian xem vé', viewExpiredNote: 'Vì lý do bảo mật, vé chỉ hiển thị 1 phút sau khi thanh toán. Để xem lại vé và mã QR, hãy nhập mã vé (TKT-...) vào ô "Tra cứu vé đã mua" bên dưới.',
        ticketTime: 'Khung giờ', ticketDate: 'Ngày', code: 'Mã vé', status: 'Trạng thái',
        st: { valid: 'Chưa sử dụng', used: 'Đã sử dụng', pending: 'Chờ thanh toán', cancelled: 'Đã hủy' },
        lookupTitle: 'Tra cứu vé đã mua', lookupDesc: 'Nhập mã vé để xem lại thông tin và mã QR.', lookup: 'Tra cứu', notFound: 'Không tìm thấy vé với mã này.',
        lookupPending: 'Vé này chưa được thanh toán. Đang mở lại trang thanh toán...',
        errGeneric: 'Có lỗi xảy ra, vui lòng thử lại', free: 'Miễn phí', footer: '© Đồ án Thuyết minh tự động đa ngôn ngữ – ĐH Sài Gòn' },
      en: { brandSub: 'Visitor tickets', title: 'Buy tickets', desc: 'Choose a date, time slot and tickets, then scan the QR code to pay. Your e-tickets become valid as soon as payment is confirmed.',
        h1: 'Choose a date', h2: 'Choose a time slot', h3: 'Choose tickets', hours: 'Open 07:30 – 16:30, every day of the week, including public holidays.',
        loadingSlots: 'Loading time slots...', noSlots: 'Could not load time slots', seats: (n) => `${n} seats left`, full: 'Sold out', past: 'Passed',
        pickSlot: 'Please choose a time slot first.', seatsLeft: (n) => `${n} seats left in this slot`, totalQty: (n) => `${n} tickets in total`,
        nameLabel: 'Full name (optional)', phoneLabel: 'Phone number (optional)',
        submit: 'Continue to payment', submitFree: 'Get tickets', submitting: 'Creating order...', chooseAtLeast: 'Choose at least 1 ticket',
        payTitle: 'Scan the QR code to pay', payLeft: (m) => `Seats held for ${m}`, payAmount: 'Amount', payContent: 'Transfer note', copy: 'Copy', copied: 'Copied',
        payVisit: 'Visit time', payItems: 'Tickets', payDemoNote: 'Demo QR code for a student project, no real money is transferred.',
        paySteps: ['Open your banking or e-wallet app and scan the QR code.', 'Check the amount and that the transfer note is your order code.', 'Keep this page open. Your e-tickets appear automatically once staff confirm the payment.'],
        waiting: 'Waiting for staff to confirm your payment...', expired: 'This order expired before payment and was cancelled. Please book again.',
        cancelled: 'This order was cancelled. If you already paid, please contact the ticket desk.', payNew: 'Start a new order',
        ok: 'Payment confirmed – here are your tickets', okNote: 'Show the QR code at the gate. Each ticket can be used once, in the time slot you chose. Take a screenshot or print them.', print: 'Print tickets', newOrder: 'Buy more tickets',
        viewLeft: (s) => `Tickets are shown for ${s} more seconds – take a screenshot or note the ticket codes`,
        viewExpiredTitle: 'Ticket viewing time is over', viewExpiredNote: 'For security, tickets are only shown for 1 minute after payment. To see a ticket and its QR code again, enter the ticket code (TKT-...) in "Find your tickets" below.',
        ticketTime: 'Time slot', ticketDate: 'Date', code: 'Ticket code', status: 'Status',
        st: { valid: 'Not used', used: 'Used', pending: 'Awaiting payment', cancelled: 'Cancelled' },
        lookupTitle: 'Find your tickets', lookupDesc: 'Enter your ticket code to view it again with its QR code.', lookup: 'Find', notFound: 'No ticket found with this code.',
        lookupPending: 'This ticket has not been paid yet. Reopening the payment page...',
        errGeneric: 'Something went wrong, please try again', free: 'Free', footer: '© Multilingual audio guide – student project' },
    };
    const MAX_PER_ORDER = 10;
    const POLL_MS = 4000;
    const L = () => STR[lang] || STR.vi;
    const money = (n) => (n === 0 ? L().free : n.toLocaleString('vi-VN') + ' đ');

    let lang = 'vi';
    let languages = [{ code: 'vi', label: 'Tiếng Việt', speech: 'vi-VN' }];
    let types = [];          // từ GET /api/tickets/types
    let slots = [];          // từ GET /api/tickets/slots?date=
    let date = '';
    let chosen = null;       // khung giờ đã chọn
    let quantities = {};     // { code: số lượng }
    let submitting = false;
    let order = null;        // đơn đang thanh toán
    let pollTimer = null;
    let countdownTimer = null;
    let viewTimer = null;    // đếm ngược thời gian còn được xem vé
    let viewDeadline = 0;    // thời điểm (ms, theo đồng hồ máy khách) hết được xem vé

    // ---------- Gọi API ----------
    async function request(method, url, body) {
      const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
      let data = null; try { data = await res.json(); } catch (e) { /* không phải JSON */ }
      if (!res.ok) { const err = new Error((data && data.message) || L().errGeneric); err.status = res.status; throw err; }
      return data;
    }

    function set(id, t) { document.getElementById(id).textContent = t; }
    function show(id, visible = true) { document.getElementById(id).classList.toggle('hidden', !visible); }

    // Ngày theo giờ Việt Nam (tránh lệch ngày khi dùng UTC)
    function vnDate(offsetDays = 0) {
      const d = new Date(Date.now() + offsetDays * 86400000);
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    }

    // Ghi trạng thái lên URL để tải lại trang không mất đơn đang thanh toán
    function setUrl(params) {
      const url = new URL(location.href);
      url.search = new URLSearchParams(params).toString();
      history.replaceState(null, '', url);
    }

    // ---------- Vẽ chữ tĩnh ----------
    function applyStatic() {
      const s = L();
      document.documentElement.lang = lang;
      set('brandSub', s.brandSub); set('pageTitle', s.title); set('pageDesc', s.desc);
      set('h1', s.h1); set('h2', s.h2); set('h3', s.h3); set('hours', s.hours);
      set('nameLabel', s.nameLabel); set('phoneLabel', s.phoneLabel);
      set('printText', s.print); set('newBtn', s.newOrder);
      set('payTitle', s.payTitle); set('payAmountLabel', s.payAmount); set('payContentLabel', s.payContent);
      set('copyText', s.copy); set('payVisitLabel', s.payVisit); set('payItemsLabel', s.payItems);
      set('payDemoNote', s.payDemoNote); set('payNewBtn', s.payNew);
      document.getElementById('paySteps').replaceChildren(...s.paySteps.map((t) => el('li', '', t)));
      set('lookupTitle', s.lookupTitle); set('lookupDesc', s.lookupDesc); set('lookupBtn', s.lookup); set('footer', s.footer);
      set('resultTitle', s.ok); set('resultNote', s.okNote);
      set('viewExpiredTitle', s.viewExpiredTitle); set('viewExpiredNote', s.viewExpiredNote);
      renderViewTimer();
      document.getElementById('date').min = vnDate(0);
      document.getElementById('date').max = vnDate(60);
      if (order) renderPayment();
    }

    // ---------- Bước 1: ngày ----------
    async function onDateChange() {
      const value = document.getElementById('date').value;
      if (!value) return;
      date = value;
      chosen = null; quantities = {};
      show('step2'); show('step3', false);
      await loadSlots();
    }

    // ---------- Bước 2: khung giờ ----------
    async function loadSlots() {
      const status = document.getElementById('slotStatus');
      document.getElementById('slots').replaceChildren();
      status.textContent = L().loadingSlots; status.classList.remove('hidden');
      try {
        slots = (await request('GET', `/api/tickets/slots?date=${encodeURIComponent(date)}`)).data || [];
        status.classList.add('hidden');
        if (chosen) chosen = slots.find((s) => s.from === chosen.from) || null;
        renderSlots();
      } catch (err) {
        slots = [];
        status.textContent = L().noSlots + ': ' + err.message; status.classList.remove('hidden');
      }
    }

    function renderSlots() {
      const box = document.getElementById('slots');
      box.replaceChildren();
      slots.forEach((s) => {
        const left = s.available;
        const disabled = s.passed || left <= 0;
        const b = el('button', 'slot-on text-left border border-heritage-brown/25 bg-white rounded-xl px-4 py-3 transition hover:border-heritage-red disabled:opacity-40 disabled:cursor-not-allowed');
        b.type = 'button';
        b.disabled = disabled;
        b.setAttribute('aria-pressed', String(Boolean(chosen && chosen.from === s.from)));
        b.append(el('p', 'font-semibold', `${s.from} – ${s.to}`),
          el('p', 'seats text-xs text-heritage-brown mt-1', disabled ? (s.passed ? L().past : L().full) : L().seats(left)));
        b.addEventListener('click', () => chooseSlot(s));
        box.append(b);
      });
    }

    function chooseSlot(s) {
      clearOrderError();
      chosen = s;
      quantities = {};
      renderSlots();
      show('step3');
      renderTypes();
      updateTotals();
    }

    // ---------- Bước 3: số lượng ----------
    function seatsLeft() { return chosen ? chosen.available : 0; }
    function totalQty() { return Object.values(quantities).reduce((a, b) => a + b, 0); }
    function totalPrice() { return types.reduce((sum, t) => sum + t.price * (quantities[t.code] || 0), 0); }
    function maxAllowed() { return Math.min(MAX_PER_ORDER, seatsLeft()); }

    function renderTypes() {
      const box = document.getElementById('types');
      box.replaceChildren();
      types.forEach((t) => {
        const row = el('div', 'flex items-center justify-between gap-4 py-4');
        const info = el('div');
        info.append(el('p', 'font-semibold text-heritage-ink', t.name),
          el('p', 'text-xs text-heritage-brown', t.description || ''),
          el('p', 'text-sm text-heritage-red font-semibold mt-1', money(t.price)));
        const ctrl = el('div', 'flex items-center gap-3 shrink-0');
        const minus = el('button', 'w-9 h-9 rounded-full border border-heritage-brown/30 text-lg hover:border-heritage-red disabled:opacity-30', '−');
        const count = el('span', 'w-8 text-center font-semibold', String(quantities[t.code] || 0));
        const plus = el('button', 'w-9 h-9 rounded-full border border-heritage-brown/30 text-lg hover:border-heritage-red disabled:opacity-30', '+');
        minus.type = plus.type = 'button';
        minus.setAttribute('aria-label', '− ' + t.name); plus.setAttribute('aria-label', '+ ' + t.name);
        minus.disabled = !(quantities[t.code] > 0);
        plus.disabled = totalQty() >= maxAllowed();
        minus.addEventListener('click', () => { clearOrderError(); quantities[t.code] = Math.max(0, (quantities[t.code] || 0) - 1); renderTypes(); updateTotals(); });
        plus.addEventListener('click', () => { clearOrderError(); if (totalQty() < maxAllowed()) { quantities[t.code] = (quantities[t.code] || 0) + 1; renderTypes(); updateTotals(); } });
        ctrl.append(minus, count, plus);
        row.append(info, ctrl);
        box.append(row);
      });
    }

    function updateTotals() {
      const qty = totalQty();
      const price = totalPrice();
      set('total', price === 0 && qty > 0 ? L().free : price.toLocaleString('vi-VN') + ' đ');
      set('totalQtyLabel', chosen ? `${L().totalQty(qty)} · ${L().seatsLeft(seatsLeft())}` : L().pickSlot);
      const btn = document.getElementById('submitBtn');
      btn.disabled = submitting || qty === 0 || !chosen;
      btn.textContent = submitting ? L().submitting : (qty > 0 && price === 0 ? L().submitFree : L().submit);
    }

    function clearOrderError() { show('orderError', false); }
    function showOrderError(message) { set('orderError', message); show('orderError'); }

    async function submitOrder() {
      if (submitting) return;
      clearOrderError();
      if (!chosen) return showOrderError(L().pickSlot);
      const items = types.filter((t) => (quantities[t.code] || 0) > 0).map((t) => ({ type: t.code, quantity: quantities[t.code] }));
      if (items.length === 0) return showOrderError(L().chooseAtLeast);
      const contact = {
        name: document.getElementById('contactName').value.trim(),
        phone: document.getElementById('contactPhone').value.trim(),
      };
      submitting = true; updateTotals();
      try {
        const body = await request('POST', '/api/tickets/orders', { date, slot: { from: chosen.from, to: chosen.to }, items, contact });
        openOrder(body.data);
      } catch (err) {
        if (err.status === 409) {          // khung giờ vừa hết chỗ: làm mới số chỗ
          await loadSlots();
          quantities = {};
          renderTypes();
        }
        showOrderError(err.message);
      } finally {
        submitting = false; updateTotals();
      }
    }

    // ---------- Bước 4: thanh toán ----------
    function openOrder(data) {
      order = data;
      setUrl({ order: data.orderId });
      if (data.status === 'paid' || data.status === 'confirmed') return showPaidOrder(data);
      show('booking', false); show('result', false); show('payment');
      renderPayment();
      startPolling();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPayment() {
      const s = L();
      if (order.payment) {
        const img = document.getElementById('payQr');
        img.src = order.payment.qr; img.alt = 'QR ' + order.orderCode;
        set('payAmount', money(order.payment.amount));
      }
      set('payContent', order.orderCode);
      set('payVisit', `${order.date} · ${order.slot.from} – ${order.slot.to}`);
      set('payItems', order.items.map((i) => `${i.quantity} × ${typeName(i.type)}`).join(', '));

      const state = document.getElementById('payState');
      const active = order.status === 'pending';
      document.getElementById('payQr').parentElement.classList.toggle('opacity-30', !active);
      let icon, text, cls;
      if (active) { icon = 'fa-solid fa-circle-notch fa-spin'; text = s.waiting; cls = 'border-heritage-gold/50 bg-heritage-paper text-heritage-ink'; }
      else if (order.status === 'expired') { icon = 'fa-solid fa-clock'; text = s.expired; cls = 'border-red-200 bg-red-50 text-red-800'; }
      else { icon = 'fa-solid fa-ban'; text = s.cancelled; cls = 'border-red-200 bg-red-50 text-red-800'; }
      state.className = 'flex items-center gap-3 rounded-xl border px-4 py-3 text-sm ' + cls;
      const i = document.createElement('i'); i.className = icon;
      state.replaceChildren(i, el('span', '', text));
      updateCountdown();
    }

    function updateCountdown() {
      const box = document.getElementById('payCountdown');
      if (!order || order.status !== 'pending' || !order.expiresAt) { box.textContent = ''; return; }
      const ms = Math.max(0, new Date(order.expiresAt).getTime() - Date.now());
      const m = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000);
      box.textContent = L().payLeft(`${m}:${String(sec).padStart(2, '0')}`);
      if (ms === 0) pollOnce(); // hết giờ: hỏi server để chuyển sang trạng thái hết hạn
    }

    async function pollOnce() {
      if (!order) return;
      try {
        const data = (await request('GET', `/api/tickets/orders/${encodeURIComponent(order.orderId)}`)).data;
        const changed = data.status !== order.status;
        order = { ...data, payment: data.payment || order.payment };
        if (data.status === 'paid' || data.status === 'confirmed') { stopPolling(); return showPaidOrder(data); }
        if (changed || data.status !== 'pending') { renderPayment(); if (data.status !== 'pending') stopPolling(); }
      } catch (err) {
        if (err.status === 404) { stopPolling(); order = null; newOrder(); }
        // lỗi mạng tạm thời: lần sau hỏi lại
      }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(pollOnce, POLL_MS);
      countdownTimer = setInterval(updateCountdown, 1000);
    }

    function stopPolling() {
      clearInterval(pollTimer); clearInterval(countdownTimer);
      pollTimer = countdownTimer = null;
    }

    async function copyCode() {
      try { await navigator.clipboard.writeText(order.orderCode); set('copyText', L().copied); setTimeout(() => set('copyText', L().copy), 1500); } catch (e) { /* trình duyệt chặn */ }
    }

    // ---------- Kết quả: vé có QR vào cổng ----------

    // Đơn đã thanh toán: chỉ hiện vé trong 60 giây đầu (server trả viewSecondsLeft), hết thì ẩn
    function showPaidOrder(data) {
      if (data.ticketsHidden || !data.tickets.length) return hideTickets();
      showTickets(data.tickets, data.viewSecondsLeft);
    }

    function stopViewTimer() {
      clearInterval(viewTimer);
      viewTimer = null; viewDeadline = 0;
      document.getElementById('viewTimer').classList.add('hidden');
    }

    function renderViewTimer() {
      if (!viewDeadline) return;
      const left = Math.max(0, Math.ceil((viewDeadline - Date.now()) / 1000));
      const box = document.getElementById('viewTimer');
      const i = document.createElement('i'); i.className = 'fa-solid fa-stopwatch';
      box.replaceChildren(i, el('span', '', L().viewLeft(left)));
      box.classList.remove('hidden');
      if (left === 0) hideTickets();
    }

    // Hết thời gian xem: xóa vé khỏi trang, hướng dẫn tra cứu bằng mã vé
    function hideTickets() {
      stopPolling(); stopViewTimer();
      setUrl({});
      document.getElementById('tickets').replaceChildren();
      document.getElementById('resultTitle').parentElement.classList.add('hidden');
      show('viewExpired');
      show('booking', false); show('payment', false); show('result');
      document.getElementById('lookupCode').focus({ preventScroll: true });
    }

    // secondsLeft: có thì đếm ngược rồi ẩn vé; không có (tra cứu bằng mã vé) thì hiện bình thường
    function showTickets(tickets, secondsLeft) {
      stopPolling(); stopViewTimer();
      document.getElementById('resultTitle').parentElement.classList.remove('hidden');
      show('viewExpired', false);
      const box = document.getElementById('tickets');
      box.replaceChildren();
      tickets.forEach((t) => {
        const card = el('article', 'ticket bg-white rounded-2xl border-2 border-dashed border-heritage-gold p-5 flex flex-col sm:flex-row gap-5 items-center');
        const img = document.createElement('img');
        img.src = t.qr; img.alt = 'QR ' + t.code; img.className = 'w-36 h-36 object-contain shrink-0';
        const info = el('div', 'text-sm space-y-1 text-center sm:text-left');
        const st = L().st[t.status] || t.status;
        info.append(
          el('p', 'font-serif text-lg font-bold text-heritage-red', typeName(t.type)),
          el('p', '', `${L().ticketDate}: ${t.date}`),
          el('p', '', `${L().ticketTime}: ${t.slot.from} – ${t.slot.to}`),
          el('p', 'font-mono text-xs break-all', `${L().code}: ${t.code}`),
          el('p', t.status === 'valid' ? 'text-green-800 font-semibold' : 'text-red-700 font-semibold', `${L().status}: ${st}`));
        card.append(img, info);
        box.append(card);
      });
      show('booking', false); show('payment', false); show('result');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (typeof secondsLeft === 'number' && secondsLeft > 0) {
        viewDeadline = Date.now() + secondsLeft * 1000;
        renderViewTimer();
        viewTimer = setInterval(renderViewTimer, 1000);
      }
    }

    function typeName(code) {
      const t = types.find((x) => x.code === code);
      return t ? t.name : code;
    }

    function newOrder() {
      stopPolling(); stopViewTimer();
      show('viewExpired', false);
      order = null; chosen = null; quantities = {}; date = '';
      setUrl({});
      document.getElementById('date').value = '';
      show('payment', false); show('result', false); show('booking');
      show('step2', false); show('step3', false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- Tra cứu vé ----------
    async function lookup(e) {
      if (e) e.preventDefault();
      const code = document.getElementById('lookupCode').value.trim().toUpperCase();
      const msg = document.getElementById('lookupMsg');
      if (!code) return;
      try {
        const t = (await request('GET', `/api/tickets/${encodeURIComponent(code)}`)).data;
        if (t.orderStatus === 'pending' && t.orderId) {
          msg.className = 'text-sm mt-3 text-heritage-brown';
          msg.textContent = L().lookupPending;
          const o = (await request('GET', `/api/tickets/orders/${encodeURIComponent(t.orderId)}`)).data;
          openOrder(o);
        } else {
          msg.className = 'text-sm mt-3 ' + (t.status === 'valid' ? 'text-green-800' : 'text-red-700');
          msg.textContent = `${typeName(t.type)} · ${t.date} · ${t.slot.from} – ${t.slot.to} · ${L().st[t.status] || t.status}`;
          if (t.qr) showTickets([t]);
        }
      } catch (err) {
        msg.className = 'text-sm mt-3 text-red-700';
        msg.textContent = err.status === 404 ? L().notFound : err.message;
      }
      msg.classList.remove('hidden');
    }

    // ---------- Khởi động ----------
    async function loadTypes() {
      try { types = (await request('GET', '/api/tickets/types')).data || []; } catch (e) { types = []; }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try { languages = (await fetchJson('/api/languages')).data; } catch (e) { /* mặc định */ }
      lang = detectLanguage(languages.map((l) => l.code).filter((c) => STR[c]));
      if (!STR[lang]) lang = 'vi';
      renderLanguageButtons(document.getElementById('langBar'), languages.filter((l) => STR[l.code]), lang, (code) => {
        lang = code; storeLang(code); applyStatic(); renderTypes(); if (slots.length) renderSlots(); updateTotals();
      }, 'text-xs');
      applyStatic();
      await loadTypes();
      document.getElementById('date').addEventListener('change', onDateChange);
      document.getElementById('submitBtn').addEventListener('click', submitOrder);
      document.getElementById('printBtn').addEventListener('click', () => window.print());
      document.getElementById('newBtn').addEventListener('click', newOrder);
      document.getElementById('payNewBtn').addEventListener('click', newOrder);
      document.getElementById('copyBtn').addEventListener('click', copyCode);
      document.getElementById('lookupForm').addEventListener('submit', lookup);
      updateTotals();

      // Mở lại đơn đang thanh toán (tải lại trang) hoặc vé từ mã QR vào cổng (?code=)
      const params = new URLSearchParams(location.search);
      if (params.get('order')) {
        try { openOrder((await request('GET', `/api/tickets/orders/${encodeURIComponent(params.get('order'))}`)).data); }
        catch (e) { setUrl({}); }
      } else if (params.get('code')) {
        document.getElementById('lookupCode').value = params.get('code');
        lookup();
      }
    });
  </script>
</body>
</html>
