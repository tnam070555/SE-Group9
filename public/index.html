async function fetchJson(url) {

  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function formatDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString(lang === 'vi' ? 'vi-VN' : lang, { year:'numeric', month:'short', day:'numeric' }); }

<script>
// ===== OPEN/CLOSE BADGE =====
function updateOpenBadge() {
  const badge = document.getElementById('openBadge');
  if (!badge) return;
  const h = new Date().getHours();
  const isOpen = h >= 7 && h < 18;
  badge.textContent = isOpen ? S().openBadge : S().closeBadge;
  badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full ' + (isOpen ? 'badge-open' : 'badge-close');
  badge.classList.remove('hidden');
}

// ===== FLOATING LANG PILL =====
function renderFloatLang() {
  const pill = document.getElementById('floatLang');
  if (!pill) return;
  const ico = pill.querySelector('i');
  pill.replaceChildren(ico);
  languages.forEach((lng) => {
    const btn = document.createElement('button');
    btn.textContent = lng.code.toUpperCase();
    btn.title = lng.label;
    if (lng.code === lang) btn.classList.add('active');
    btn.addEventListener('click', () => changeLanguage(lng.code));
    pill.append(btn);
  });
}

// ===== BACK TO TOP =====
function initBackToTop() {
  const btn = document.getElementById('backToTop');
  if (!btn) return;
  window.addEventListener('scroll', () => btn.classList.toggle('show', window.scrollY > 400), { passive: true });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

// ===== SCROLL FADE-IN =====
function initScrollFade() {
  if (!window.IntersectionObserver) return;
  scrollObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('visible'); scrollObs.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.fade-in-up').forEach((el) => scrollObs.observe(el));
}
function observeCards() {
  if (!scrollObs) return;
  document.querySelectorAll('.fade-in-up:not(.visible)').forEach((el) => scrollObs.observe(el));
}

// ===== LANGUAGE =====
function renderLangBar() {
  const bar = document.getElementById('langBar');
  if (!bar) return;
  bar.replaceChildren();
  languages.forEach(({ code, label, flag }) => {
    const btn = document.createElement('button');
    btn.setAttribute('aria-pressed', code === lang);
    btn.className = 'lang-btn text-xs font-semibold px-2.5 py-1 rounded-full border border-white/25 text-white/80 hover:bg-white/15 transition-colors';
    btn.innerHTML = `<span class="mr-1">${flag}</span>${code.toUpperCase()}`;
    btn.title = label;
    btn.addEventListener('click', () => changeLanguage(code));
    bar.appendChild(btn);
  });
}

function changeLanguage(code) {
  lang = code;
  localStorage.setItem('lang', lang);
  renderLangBar();
  renderFloatLang();
  updateTexts();
  updateOpenBadge();
  renderAreaChips();
  renderGrid();
}

// ===== UPDATE UI TEXTS =====
function updateTexts() {
  const s = S();
  const set = (id, val) => { const el = document.getElementById(id); if (el && val !== undefined) el.textContent = val; };
  set('heroTitle', s.heroTitle); set('heroSubtitle', s.heroSubtitle);
  set('subtitleText', s.subtitle);
  set('statLabel', s.statLabel); set('statLangs', s.statLangs); set('statAreas', s.statAreas);
  const inp = document.getElementById('search');
  if (inp) inp.placeholder = s.searchPlaceholder;
  // emptyReset button text
  const resetBtn = document.getElementById('emptyReset');
  if (resetBtn) { const sp = resetBtn.querySelector('span'); if (sp) sp.textContent = s.emptyReset; }
}

// ===== AREA CHIPS =====
function renderAreaChips() {
  const s = S();
  const wrap = document.getElementById('areaChips');
  if (!wrap) return;
  wrap.replaceChildren();
  const mkChip = (slug, label) => {
    const btn = document.createElement('button');
    const isActive = areaFilter === slug;
    btn.textContent = label;
    btn.className = 'text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors ' +
      (isActive ? 'chip-active border-heritage-red' : 'border-heritage-gold/30 bg-white text-heritage-brown hover:bg-heritage-red/10 hover:border-heritage-red/40');
    btn.addEventListener('click', () => { areaFilter = slug; renderAreaChips(); renderGrid(); });
    wrap.appendChild(btn);
  };
  mkChip('all', s.allAreas);
  AREA_ORDER.forEach((slug) => {
    const a = AREAS[slug]; if (!a) return;
    mkChip(slug, a.name[lang] || a.name.vi);
  });
}

// ===== MAKE CARD =====
function makeCard(a) {
  const area = AREAS[a.categorySlug] || {};
  const areaName = area.name ? (area.name[lang] || area.name.vi) : (a.categorySlug || '');
  const s = S();

  const article = document.createElement('article');
  article.className = 'card bg-white rounded-2xl border border-heritage-gold/20 overflow-hidden cursor-pointer fade-in-up';
  article.setAttribute('role', 'button');
  article.setAttribute('tabindex', '0');
  article.setAttribute('aria-label', a.name || '');
  article.addEventListener('click', () => openModal(a));
  article.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(a); } });

  const imgBand = `<div class="img-band w-full h-44 overflow-hidden relative flex items-center justify-center">
    ${a.imageUrl
      ? `<img src="${a.imageUrl}" alt="${a.name || ''}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : ''}
    <div class="flex flex-col items-center justify-center text-white/60 gap-2 absolute inset-0 ${a.imageUrl ? 'hidden' : ''}">
      <i class="${area.icon || 'fa-solid fa-landmark'} text-4xl text-white/50"></i>
      <span class="text-xs text-white/40">${areaName}</span>
    </div>
  </div>`;

  const body = `<div class="p-5">
    <div class="flex items-start justify-between gap-2 mb-2">
      <h3 class="text-base font-bold text-heritage-ink leading-snug flex-1">${a.name || '—'}</h3>
      <span class="flex-shrink-0 text-xs font-mono px-1.5 py-0.5 rounded bg-heritage-gold/10 text-heritage-brown/60 border border-heritage-gold/15 mt-0.5">${a.code || ''}</span>
    </div>
    <div class="flex items-center gap-1.5 mb-2.5">
      <i class="${area.icon || 'fa-solid fa-layer-group'} text-[10px] text-heritage-red/70"></i>
      <span class="text-[11px] text-heritage-brown/60 font-medium">${areaName}</span>
    </div>
    <p class="text-sm text-heritage-ink/70 leading-relaxed line-clamp-3 mb-4">${a.description || ''}</p>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1">
        ${a.audioUrl ? `<span class="flex items-center gap-1 text-[10px] text-heritage-brown/50"><i class="fa-solid fa-headphones text-heritage-red/60 text-xs"></i> Audio</span>` : ''}
      </div>
      <span class="text-xs text-heritage-red font-semibold flex items-center gap-1">
        ${s.modalCode === 'Mã' ? 'Chi tiết' : (s.modalCode === 'Code' ? 'Details' : s.modalCode)}
        <i class="fa-solid fa-arrow-right text-[10px]"></i>
      </span>
    </div>
  </div>`;

  article.innerHTML = imgBand + body;
  return article;
}

// ===== RENDER GRID =====
function renderGrid() {
  const s = S();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const emptyText = document.getElementById('emptyText');
  if (!grid) return;
  grid.replaceChildren();

  const q = (document.getElementById('search')?.value || '').toLowerCase().trim();

  let filtered = artifacts.filter((a) => {
    const matchArea = areaFilter === 'all' || a.categorySlug === areaFilter;
    const matchQ = !q || (a.name || '').toLowerCase().includes(q) || (a.description || '').toLowerCase().includes(q) || (a.code || '').toLowerCase().includes(q);
    return matchArea && matchQ;
  });

  if (filtered.length === 0) {
    empty.classList.remove('hidden');
    if (emptyText) emptyText.textContent = s.emptyTitle;
    document.getElementById('statCount').textContent = 0;
    return;
  }
  empty.classList.add('hidden');
  document.getElementById('statCount').textContent = artifacts.length;

  // Group by area in floor order
  const groups = {};
  AREA_ORDER.forEach((slug) => { groups[slug] = []; });
  const otherKey = '__other__';
  groups[otherKey] = [];
  filtered.forEach((a) => {
    if (groups[a.categorySlug] !== undefined) groups[a.categorySlug].push(a);
    else groups[otherKey].push(a);
  });

  const allKeys = [...AREA_ORDER, otherKey];
  allKeys.forEach((slug) => {
    const items = groups[slug];
    if (!items || items.length === 0) return;
    const area = AREAS[slug];
    if (area) {
      const section = document.createElement('section');
      section.className = 'mb-10';
      const h2 = document.createElement('div');
      h2.className = 'flex items-center gap-2 mb-4';
      h2.innerHTML = `<i class="${area.icon} text-heritage-red text-sm"></i><h2 class="text-base font-bold text-heritage-ink">${area.name[lang] || area.name.vi}</h2><span class="text-xs text-heritage-brown/50 ml-1">(${items.length})</span>`;
      section.appendChild(h2);
      const cardGrid = document.createElement('div');
      cardGrid.className = 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6';
      items.forEach((a) => cardGrid.appendChild(makeCard(a)));
      section.appendChild(cardGrid);
      grid.appendChild(section);
    } else {
      const cardGrid = document.createElement('div');
      cardGrid.className = 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6 mb-6';
      items.forEach((a) => cardGrid.appendChild(makeCard(a)));
      grid.appendChild(cardGrid);
    }
  });

  observeCards();
}
</script>

<script>
// ===== MODAL =====
function openModal(a) {
  const s = S();
  const area = AREAS[a.categorySlug] || {};
  const areaName = area.name ? (area.name[lang] || area.name.vi) : '';

  // Image band
  const modalImg = document.getElementById('modalImg');
  const modalImgIcon = document.getElementById('modalImgIcon');
  if (a.imageUrl) {
    modalImg.src = a.imageUrl;
    modalImg.alt = a.name || '';
    modalImg.classList.remove('hidden');
    modalImgIcon.style.display = 'none';
    modalImg.onerror = () => {
      modalImg.classList.add('hidden');
      modalImgIcon.style.display = 'flex';
      const i = modalImgIcon.querySelector('i');
      const sp = modalImgIcon.querySelector('span');
      if (i) i.className = (area.icon || 'fa-solid fa-landmark') + ' text-5xl text-white/50';
      if (sp) sp.textContent = areaName;
    };
  } else {
    modalImg.classList.add('hidden');
    modalImgIcon.style.display = 'flex';
    const i = modalImgIcon.querySelector('i');
    const sp = modalImgIcon.querySelector('span');
    if (i) i.className = (area.icon || 'fa-solid fa-landmark') + ' text-5xl text-white/50';
    if (sp) sp.textContent = areaName;
  }

  document.getElementById('mAreaBadge').textContent = areaName;
  document.getElementById('mCodeBadge').textContent = a.code ? `${s.modalCode}: ${a.code}` : '';
  document.getElementById('modalName').textContent = a.name || '';
  document.getElementById('modalDesc').textContent = a.description || '';

  // Detail grid
  const det = document.getElementById('modalDetails');
  det.replaceChildren();
  const addDetail = (icon, label, val) => {
    if (!val) return;
    const d = document.createElement('div');
    d.className = 'flex items-start gap-2 bg-white rounded-xl p-3 border border-heritage-gold/15';
    d.innerHTML = `<i class="${icon} text-heritage-red/70 mt-0.5 text-xs flex-shrink-0"></i><div><p class="text-[10px] text-heritage-brown/50 uppercase tracking-wider font-medium mb-0.5">${label}</p><p class="text-xs text-heritage-ink font-semibold">${val}</p></div>`;
    det.appendChild(d);
  };
  addDetail('fa-solid fa-map-pin', areaName ? (lang === 'vi' ? 'Vị trí' : 'Location') : '', areaName);
  addDetail('fa-solid fa-hashtag', s.modalCode, a.code);
  if (a.updatedAt) addDetail('fa-solid fa-calendar-days', s.modalUpdated, formatDate(a.updatedAt));

  // Audio
  const audioWrap = document.getElementById('modalAudioWrap');
  const audioEl = document.getElementById('modalAudio');
  if (a.audioUrl) {
    audioEl.src = a.audioUrl; audioWrap.classList.remove('hidden');
    document.getElementById('modalAudioLabel').textContent = s.modalAudioLabel;
  } else { audioWrap.classList.add('hidden'); audioEl.src = ''; }

  document.getElementById('modalFooter').textContent = s.modalFooter;
  const closeBtn2 = document.getElementById('modalCloseBtn2') || document.getElementById('modalClose2');
  if (closeBtn2) closeBtn2.textContent = s.modalCloseBtn;

  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalName').focus();
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const audioEl = document.getElementById('modalAudio');
  if (audioEl) audioEl.pause();
  document.getElementById('modal').classList.add('hidden');
  document.body.style.overflow = '';
}

// ===== LOAD ARTIFACTS =====
async function loadArtifacts() {
  document.getElementById('skeleton').classList.remove('hidden');
  document.getElementById('grid').replaceChildren();
  document.getElementById('empty').classList.add('hidden');
  const statusEl = document.getElementById('status');
  statusEl.classList.add('hidden');

  try {
    const body = await fetchJson('/api/artifacts?lang=' + lang);
    artifacts = body.data || [];
  } catch (err) {
    artifacts = [];
    statusEl.textContent = S().error + ': ' + err.message;
    statusEl.classList.remove('hidden');
  }

  document.getElementById('skeleton').classList.add('hidden');
  document.getElementById('statCount').textContent = artifacts.length;
  renderAreaChips();
  renderGrid();
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  // Init UI
  renderLangBar();
  renderFloatLang();
  updateTexts();
  updateOpenBadge();
  setInterval(updateOpenBadge, 60000);
  initBackToTop();
  initScrollFade();

  // Modal close
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalClose2').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // Search
  const searchEl = document.getElementById('search');
  let searchTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderGrid, 280);
  });

  // Empty reset
  const resetBtn = document.getElementById('emptyReset');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      areaFilter = 'all';
      if (searchEl) searchEl.value = '';
      renderAreaChips();
      renderGrid();
    });
  }

  // Load data
  loadArtifacts();
});
</script>
</body>
</html>
