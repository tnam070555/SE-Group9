<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinh Độc Lập - Thuyết Minh Tự Động</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#f5f0e6',
                            DEFAULT: '#c19a6b', // Màu vàng đồng/gỗ
                            dark: '#8b6f4e',
                            text: '#2c2724'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Tùy chỉnh thanh cuộn ẩn cho giao diện mobile mượt mà */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-stone-50 text-brand-text font-sans antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-10 h-10 bg-brand rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-landmark"></i>
                    </div>
                    <h1 class="font-serif font-bold text-xl tracking-wide text-brand-dark" id="ui-title">Dinh Độc Lập</h1>
                </div>
                <!-- Language Selector -->
                <div class="relative">
                    <select id="languageSelect" class="appearance-none bg-stone-100 border border-stone-200 text-stone-700 py-1.5 pl-3 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand font-medium cursor-pointer">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">English</option>
                        <option value="ja">日本語 (Nhật)</option>
                        <option value="ko">한국어 (Hàn)</option>
                        <option value="zh">中文 (Trung)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-stone-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-brand-dark overflow-hidden">
        <!-- Ảnh nền mờ mờ giả lập (Nếu có ảnh thật, thay vào thẻ src) -->
        <div class="absolute inset-0 opacity-20 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1540324155974-7523202daa3f?auto=format&fit=crop&q=80');"></div>
        <div class="relative max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20 text-center">
            <h2 class="text-3xl md:text-5xl font-serif font-bold text-white mb-4 drop-shadow-md" id="ui-hero-title">Khám phá Lịch sử</h2>
            <p class="text-brand-light text-base md:text-lg max-w-2xl mx-auto font-light" id="ui-hero-desc">Lắng nghe câu chuyện ẩn giấu đằng sau mỗi hiện vật và không gian kiến trúc độc đáo.</p>
        </div>
    </header>

    <!-- Floating Action: Scan QR (Nổi lên giữa Hero và Content) -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 relative z-10 flex justify-center">
        <button onclick="openScanner()" class="bg-brand hover:bg-brand-dark text-white rounded-full shadow-lg px-8 py-4 flex items-center gap-3 transition-transform transform hover:scale-105 active:scale-95 border-4 border-stone-50">
            <i class="fa-solid fa-qrcode text-xl"></i>
            <span class="font-semibold text-lg" id="ui-btn-scan">Quét Mã QR</span>
        </button>
    </div>

    <!-- Main Content: Artifacts List -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="flex items-center gap-2 mb-6">
            <i class="fa-solid fa-map-location-dot text-brand"></i>
            <h3 class="text-xl font-serif font-bold text-brand-text" id="ui-list-title">Danh sách khu vực tham quan</h3>
        </div>

        <!-- Trạng thái tải dữ liệu -->
        <div id="loading" class="flex flex-col items-center justify-center py-12 text-stone-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-brand"></i>
            <span id="ui-loading">Đang tải dữ liệu...</span>
        </div>

        <!-- Lưới danh sách -->
        <div id="artifactsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Thẻ mẫu sẽ được render bằng JS -->
        </div>

        <!-- Thông báo lỗi -->
        <div id="errorMessage" class="hidden text-center text-red-500 py-8 bg-red-50 rounded-xl border border-red-100"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-800 text-stone-400 py-8 text-center mt-auto">
        <div class="max-w-5xl mx-auto px-4">
            <p class="mb-2 font-serif text-stone-300">Dinh Độc Lập - Independence Palace</p>
            <p class="text-sm">Hệ thống Thuyết minh tự động đa ngôn ngữ</p>
            <p class="text-xs mt-4 opacity-50">&copy; 2026 Đồ án Công nghệ phần mềm - Nhóm 9.</p>
        </div>
    </footer>

    <!-- Script xử lý logic -->
    <script>
        const API_URL = '/api/artifacts';
        let currentLang = localStorage.getItem('pref_lang') || 'vi';
        
        // Cấu hình ngôn ngữ tĩnh cho UI
        const uiTranslations = {
            vi: { title: "Dinh Độc Lập", heroTitle: "Khám phá Lịch sử", heroDesc: "Lắng nghe câu chuyện ẩn giấu đằng sau mỗi hiện vật và không gian kiến trúc độc đáo.", btnScan: "Quét Mã QR", listTitle: "Danh sách khu vực tham quan", loading: "Đang tải dữ liệu...", btnListen: "Nghe thuyết minh" },
            en: { title: "Independence Palace", heroTitle: "Discover History", heroDesc: "Listen to the hidden stories behind every artifact and unique architectural space.", btnScan: "Scan QR Code", listTitle: "Places to Visit", loading: "Loading data...", btnListen: "Listen to Audio Guide" },
            ja: { title: "独立宮殿", heroTitle: "歴史の発見", heroDesc: "すべての遺物とユニークな建築空間の背後に隠された物語を聞く。", btnScan: "QRをスキャン", listTitle: "見学エリア", loading: "データを読み込んでいます...", btnListen: "音声ガイドを聞く" },
            ko: { title: "독립궁", heroTitle: "역사 탐험", heroDesc: "모든 유물과 독특한 건축 공간 뒤에 숨겨진 이야기를 들어보세요.", btnScan: "QR 코드 스캔", listTitle: "관람 구역 목록", loading: "데이터 로드 중...", btnListen: "오디오 가이드 듣기" },
            zh: { title: "独立宫", heroTitle: "探索历史", heroDesc: "聆听每件文物和独特建筑空间背后隐藏的故事。", btnScan: "扫描二维码", listTitle: "参观区域列表", loading: "加载数据中...", btnListen: "收听语音导览" }
        };

        const langSelect = document.getElementById('languageSelect');
        const grid = document.getElementById('artifactsGrid');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('errorMessage');

        // Khởi tạo
        langSelect.value = currentLang;
        updateUIStaticText(currentLang);
        fetchArtifacts(currentLang);

        // Sự kiện đổi ngôn ngữ
        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('pref_lang', currentLang);
            updateUIStaticText(currentLang);
            fetchArtifacts(currentLang);
        });

        // Hàm cập nhật chữ trên giao diện theo ngôn ngữ
        function updateUIStaticText(lang) {
            const texts = uiTranslations[lang] || uiTranslations['vi'];
            document.getElementById('ui-title').textContent = texts.title;
            document.getElementById('ui-hero-title').textContent = texts.heroTitle;
            document.getElementById('ui-hero-desc').textContent = texts.heroDesc;
            document.getElementById('ui-btn-scan').textContent = texts.btnScan;
            document.getElementById('ui-list-title').textContent = texts.listTitle;
            document.getElementById('ui-loading').textContent = texts.loading;
        }

        // Tải danh sách công trình từ API
        async function fetchArtifacts(lang) {
            grid.classList.add('hidden');
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            grid.innerHTML = ''; // Làm sạch lưới trước khi load mới (an toàn vì tự sinh element phía dưới)

            try {
                const response = await fetch(`${API_URL}?lang=${lang}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    renderCards(result.data, lang);
                } else {
                    showError("Không có dữ liệu.");
                }
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
                showError("Đã xảy ra lỗi khi kết nối với máy chủ.");
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Tạo giao diện thẻ công trình một cách bảo mật (không dùng innerHTML cho dữ liệu)
        function renderCards(artifacts, lang) {
            const texts = uiTranslations[lang] || uiTranslations['vi'];
            const fragment = document.createDocumentFragment();

            artifacts.forEach(item => {
                // Thẻ Card chính
                const card = document.createElement('a');
                // Trỏ tới trang chi tiết kèm theo mã code và ngôn ngữ hiện tại
                card.href = `/detail.html?code=${item.code}&lang=${lang}`; 
                card.className = "group block bg-white rounded-2xl border border-stone-100 shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden relative";

                // Nhãn Ngôn ngữ Fallback (Nếu có)
                if (item.fallback) {
                    const badge = document.createElement('span');
                    badge.className = "absolute top-3 left-3 bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10";
                    badge.textContent = "Chưa có bản dịch";
                    card.appendChild(badge);
                }

                // Vùng ảnh giả lập (Vì CSDL chưa có ảnh, dùng pattern hoặc icon nền)
                const imgArea = document.createElement('div');
                imgArea.className = "h-40 bg-stone-100 flex items-center justify-center text-stone-300 group-hover:bg-brand-light transition-colors";
                const icon = document.createElement('i');
                icon.className = "fa-solid fa-archway text-4xl";
                imgArea.appendChild(icon);
                card.appendChild(imgArea);

                // Phần Nội dung
                const content = document.createElement('div');
                content.className = "p-5";

                const title = document.createElement('h4');
                title.className = "font-serif font-bold text-lg text-brand-dark mb-1 line-clamp-1 group-hover:text-brand transition-colors";
                title.textContent = item.name;
                content.appendChild(title);

                const locDiv = document.createElement('div');
                locDiv.className = "flex items-center gap-1 text-xs text-stone-500 mb-3";
                const locIcon = document.createElement('i');
                locIcon.className = "fa-solid fa-location-dot";
                const locText = document.createElement('span');
                locText.textContent = item.location || "Dinh Độc Lập";
                locDiv.appendChild(locIcon);
                locDiv.appendChild(locText);
                content.appendChild(locDiv);

                const desc = document.createElement('p');
                desc.className = "text-sm text-stone-600 line-clamp-2 mb-4 font-light";
                desc.textContent = item.description;
                content.appendChild(desc);

                // Nút CTA (Nghe thuyết minh)
                const btn = document.createElement('div');
                btn.className = "text-brand font-medium text-sm flex items-center gap-2";
                const btnIcon = document.createElement('i');
                btnIcon.className = "fa-regular fa-circle-play";
                const btnText = document.createElement('span');
                btnText.textContent = texts.btnListen;
                
                btn.appendChild(btnIcon);
                btn.appendChild(btnText);
                content.appendChild(btn);

                card.appendChild(content);
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
            grid.classList.remove('hidden');
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }

        // Hàm mô phỏng mở camera quét QR (Có thể trỏ tới một thư viện quét QR JS thật sau này)
        function openScanner() {
            // Tạm thời hiển thị alert. Ở đồ án thực tế, du khách dùng app camera của điện thoại quét mã thật để vào link.
            alert("Vui lòng sử dụng ứng dụng Camera hoặc Zalo trên điện thoại của bạn để quét mã QR gắn tại hiện vật.");
        }
    </script>
</body>
</html>
