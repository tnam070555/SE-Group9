<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dinh Độc Lập – Thuyết minh đa ngôn ngữ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Be Vietnam Pro"', 'sans-serif'] },
        colors: {
          heritage: { red: '#8B1E24', redDeep: '#5E1216', gold: '#C9A227', goldSoft: '#E8D9A6', paper: '#F7F3EA', ink: '#2A2320', brown: '#6B5443' }
        }
      } }
    };
  </script>
  <style>
    body {
      background: #F7F3EA;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(139,30,36,.06) 1px, transparent 0);
      background-size: 22px 22px;
    }
    .gold-rule { background: linear-gradient(90deg, transparent, #C9A227, transparent); height: 2px; }
    .hero-bg {
      background:
        linear-gradient(180deg, rgba(94,18,22,.92) 0%, rgba(139,30,36,.88) 60%, rgba(139,30,36,.95) 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 12px, transparent 12px 24px);
    }
    .card { transition: transform .35s ease, box-shadow .35s ease; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 18px 30px -12px rgba(94,18,22,.35); }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .chip-active { background: #8B1E24; color: #fff; border-color: #8B1E24; }
    .modal-in { animation: pop .3s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
    .lang-btn[aria-pressed="true"] { background: #C9A227; color: #2A2320; border-color: #C9A227; }
    html { scroll-behavior: smooth; }
    .img-band { background: linear-gradient(135deg, #5E1216 0%, #8B1E24 50%, #6B5443 100%); }
    .img-band img { transition: transform .5s ease; }
    .card:hover .img-band img { transform: scale(1.06); }
    /* Mobile area chips: horizontal scroll thay vì wrap */
    @media (max-width: 1023px) {
      #areaChips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      #areaChips::-webkit-scrollbar { display: none; }
      #areaChips button { flex-shrink: 0; }
    }
    /* Search input full-width trên mobile */
    @media (max-width: 640px) {
      #search { width: 100%; }
    }
    /* Lang bar compact trên màn hình rất nhỏ */
    @media (max-width: 360px) {
      #langBar button { font-size: 11px; padding: 4px 8px; }
    }
  </style>
</head>
<body class="font-sans text-heritage-ink antialiased">

  <!-- ===== THANH ĐIỀU HƯỚNG ===== -->
  <header class="sticky top-0 z-40 bg-heritage-paper/95 backdrop-blur border-b border-heritage-gold/40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-full border-2 border-heritage-red text-heritage-red bg-white flex items-center justify-center shadow-sm flex-shrink-0">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div>
          <p class="font-serif font-bold text-base sm:text-lg leading-tight text-heritage-red uppercase tracking-wide">Dinh Độc Lập</p>
          <p class="text-xs text-heritage-brown" id="brandSub">Thuyết minh đa ngôn ngữ</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2" id="langBar" aria-label="Chọn ngôn ngữ"></div>
    </div>
    <div class="gold-rule"></div>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero-bg text-heritage-paper relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-16 md:py-20 text-center relative">
      <p class="uppercase tracking-[0.3em] text-xs text-heritage-goldSoft mb-4" id="heroKicker"></p>
      <h2 class="font-serif text-2xl sm:text-4xl md:text-5xl font-bold mb-4 sm:mb-5 leading-tight" id="heroTitle"></h2>
      <p class="max-w-2xl mx-auto text-heritage-paper/85 leading-relaxed" id="heroDesc"></p>
      <div class="mt-8 inline-flex items-center gap-2 bg-black/20 border border-heritage-gold/50 rounded-full px-5 py-2 text-sm">
        <i class="fa-solid fa-qrcode text-heritage-gold"></i>
        <span id="heroHint"></span>
      </div>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    <div class="grid lg:grid-cols-[260px_1fr] gap-8 items-start">

      <!-- Cột khu vực (bên trái): Tất cả khu vực + từng khu vực -->
      <aside class="lg:sticky lg:top-32">
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-heritage-brown mb-2 lg:mb-3" id="areaTitle"></p>
        <div id="areaChips" class="flex flex-wrap lg:flex-col gap-2"></div>
      </aside>

      <!-- Cột công trình (bên phải) -->
      <div class="min-w-0">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
          <div>
            <h3 class="font-serif text-2xl font-bold text-heritage-red" id="listTitle"></h3>
            <p class="text-sm text-heritage-brown mt-1" id="listCount"></p>
          </div>
          <label class="relative block w-full md:w-80">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-heritage-brown/60"></i>
            <input id="search" type="search" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-heritage-brown/25 bg-white focus:outline-none focus:border-heritage-gold focus:ring-2 focus:ring-heritage-gold/30" placeholder="">
          </label>
        </div>

        <p id="status" class="text-center text-heritage-brown py-10 hidden"></p>
        <div id="grid"></div>
        <div id="empty" class="hidden text-center py-16">
          <i class="fa-regular fa-folder-open text-4xl text-heritage-brown/40 mb-3"></i>
          <p class="text-heritage-brown" id="emptyText"></p>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== MÃ QR CỦA TRANG WEB ===== -->
  <section class="bg-white border-y border-heritage-gold/40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12 grid md:grid-cols-[auto,1fr] gap-6 sm:gap-8 items-center">
      <div class="bg-heritage-paper p-5 rounded-2xl border border-heritage-gold/50 shadow-sm mx-auto">
        <img id="siteQrImg" alt="Mã QR trang web" class="w-48 h-48 object-contain bg-white">
        <p id="siteQrError" class="hidden text-xs text-red-700 mt-2 max-w-[12rem] text-center"></p>
      </div>
      <div>
        <h3 class="font-serif text-2xl font-bold text-heritage-red mb-2" id="siteQrTitle"></h3>
        <p class="text-heritage-ink/80 leading-relaxed mb-4" id="siteQrDesc"></p>
        <label class="block text-xs font-semibold text-heritage-brown mb-1" for="siteBase" id="siteBaseLabel"></label>
        <input id="siteBase" type="text" class="w-full font-mono text-xs px-3 py-2 rounded-lg border border-heritage-brown/25 bg-white focus:outline-none focus:border-heritage-gold" placeholder="http://192.168.1.10:5000">
        <p id="siteWarn" class="text-xs text-amber-700 mt-2 hidden"></p>
        <a id="siteDownload" download="QR-Dinh-Doc-Lap.png" class="inline-flex items-center gap-2 mt-4 text-sm font-semibold text-heritage-red underline underline-offset-4"></a>
      </div>
    </div>
  </section>

  <!-- ===== CHI TIẾT / NGHE / QR ===== -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-heritage-redDeep/70 backdrop-blur-sm">
    <div class="modal-in bg-heritage-paper rounded-2xl sm:rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative border border-heritage-gold/40">
      <button id="modalClose" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white border border-heritage-brown/20 text-heritage-brown hover:text-heritage-red" aria-label="Đóng">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="p-5 sm:p-7 md:p-9">
        <div class="flex items-center gap-3 mb-4">
          <span id="mCode" class="text-xs font-bold tracking-wider bg-heritage-red text-white px-3 py-1 rounded-full"></span>
          <span id="mArea" class="text-xs text-heritage-brown flex items-center gap-1"></span>
        </div>
        <h3 id="mTitle" class="font-serif text-3xl font-bold text-heritage-red mb-2"></h3>
        <p id="mLocation" class="text-sm text-heritage-brown mb-5 flex items-center gap-2"></p>
        <div class="gold-rule mb-5"></div>

        <p id="mFallback" class="text-xs text-amber-800 bg-amber-100 border border-amber-200 rounded-lg px-3 py-2 mb-4 hidden"></p>
        <p id="mDesc" class="leading-relaxed text-heritage-ink/90 text-[15px] mb-6"></p>

        <!-- Tab -->
        <div class="flex gap-6 border-b border-heritage-brown/20 mb-5">
          <button id="tabAudio" class="pb-2 font-semibold text-sm border-b-2 border-heritage-red text-heritage-red"></button>
          <button id="tabQr" class="pb-2 font-semibold text-sm border-b-2 border-transparent text-heritage-brown hover:text-heritage-red"></button>
        </div>

        <div id="viewAudio" class="text-center">
          <button id="playBtn" class="inline-flex items-center gap-3 bg-heritage-red hover:bg-heritage-redDeep text-white font-semibold px-7 py-3 rounded-full shadow-lg transition">
            <i class="fa-solid fa-play" id="playIcon"></i> <span id="playText"></span>
          </button>
          <button id="stopBtn" class="ml-2 inline-flex items-center gap-2 border border-heritage-brown/30 text-heritage-brown px-5 py-3 rounded-full hover:border-heritage-red hover:text-heritage-red">
            <i class="fa-solid fa-stop"></i> <span id="stopText"></span>
          </button>
          <p id="speechNote" class="text-xs text-heritage-brown mt-4 hidden"></p>
          <a id="detailLink" target="_blank" rel="noopener" class="block mt-5 text-sm text-heritage-red underline underline-offset-4"></a>
        </div>

        <div id="viewQr" class="hidden text-center">
          <div class="inline-block bg-white p-4 rounded-2xl border border-heritage-gold/50 shadow-sm">
            <img id="qrImg" alt="QR" class="w-56 h-56 object-contain">
          </div>
          <p class="text-sm text-heritage-brown mt-4" id="qrHint"></p>
          <label class="block text-left mt-5 text-xs font-semibold text-heritage-brown" for="qrBase" id="qrBaseLabel"></label>
          <input id="qrBase" type="text" class="mt-1 w-full font-mono text-xs px-3 py-2 rounded-lg border border-heritage-brown/25 bg-white focus:outline-none focus:border-heritage-gold" placeholder="http://192.168.1.10:5000">
          <p id="qrWarn" class="text-xs text-amber-700 mt-2 text-left hidden"></p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-heritage-redDeep text-heritage-paper/80 mt-16">
    <div class="gold-rule"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-10 grid md:grid-cols-3 gap-6 sm:gap-8 text-sm">
      <div>
        <p class="font-serif text-lg font-bold text-heritage-goldSoft mb-2">Dinh Độc Lập</p>
        <p id="footDesc" class="leading-relaxed"></p>
      </div>
      <div>
        <p class="font-semibold text-heritage-goldSoft mb-2" id="footHowTitle"></p>
        <p id="footHow" class="leading-relaxed"></p>
      </div>
      <div>
        <p class="font-semibold text-heritage-goldSoft mb-2" id="footProjTitle"></p>
        <p id="footProj" class="leading-relaxed"></p>
      </div>
    </div>
    <div class="border-t border-white/10 py-4 text-center text-xs text-heritage-paper/60" id="footCopy"></div>
  </footer>

  <script src="js/common.js"></script>

        noSpeech: '이 기기는 음성 읽기를 지원하지 않습니다.', footHowTitle: '이용 방법', footHow: '전시물의 QR 코드를 스캔하고 언어를 고른 뒤 재생을 누르세요.',
        footProjTitle: '소프트웨어 공학 프로젝트', footProj: '사이공 대학교 정보기술학부', copy: '© 다국어 음성 안내 – 학생 프로젝트' },
      zh: { areaTitle: '区域', other: '其他', siteQrError: '无法加载二维码。请检查服务器是否已更新（有 /api/site/qr 接口）并正在运行。', siteQrTitle: '扫码打开本导览', siteQrDesc: '游客可用手机扫描此码，在自己的设备上打开语音讲解页面。', siteBaseLabel: '服务器地址（供手机访问）', siteWarn: '当前使用 localhost，手机无法扫描。请输入运行服务器的电脑 IP 地址。', siteDownload: '下载二维码图片', brandSub: '多语种语音讲解', kicker: '国家历史遗迹', heroTitle: '穿越历史厅室的旅程',
        heroDesc: '独立宫的每一件展品都有自己的故事。扫描展品上的二维码，即可用您的语言聆听讲解。',
        heroHint: '扫描每件展品的二维码聆听讲解', listTitle: '展品列表', search: '搜索展品...', all: '全部区域',
        count: (n) => `共 ${n} 件展品`, empty: '没有找到符合条件的展品。', loading: '加载中...', error: '无法加载数据',
        listen: '聆听讲解', stop: '停止', tabAudio: '聆听讲解', tabQr: '二维码', detail: '打开详情页',
        qrHint: '用手机扫描，即可打开该展品的讲解页面。', qrBase: '服务器地址（供手机访问）',
        qrWarn: '当前使用 localhost，手机无法扫描。请输入运行服务器的电脑 IP 地址。', fallback: '该展品暂无翻译，正在显示越南语。',
        noSpeech: '此设备不支持语音朗读。', footHowTitle: '使用方法', footHow: '扫描展品上的二维码，选择语言后点击播放。',
        footProjTitle: '软件工程课程项目', footProj: '西贡大学 信息技术学院', copy: '© 多语种语音讲解 – 学生项目' },
    };

    // Khu vực: slug khớp với categorySlug trong dữ liệu và 6 mục categories trong MongoDB
    const AREAS = {
      'tang-tret':  { icon: 'fa-door-open', name: { vi: 'Tầng trệt', en: 'Ground floor', ja: '1階', ko: '1층', zh: '一楼' } },
      'lau-1':      { icon: 'fa-stairs',    name: { vi: 'Lầu 1', en: 'First floor', ja: '2階', ko: '2층', zh: '二楼' } },
      'lau-2':      { icon: 'fa-stairs',    name: { vi: 'Lầu 2', en: 'Second floor', ja: '3階', ko: '3층', zh: '三楼' } },
      'san-thuong': { icon: 'fa-sun',       name: { vi: 'Tầng sân thượng', en: 'Rooftop', ja: '屋上', ko: '옥상', zh: '屋顶' } },
      'tang-ham':   { icon: 'fa-lock',      name: { vi: 'Tầng hầm', en: 'Basement', ja: '地下', ko: '지하', zh: '地下室' } },
      'ngoai-troi': { icon: 'fa-tree',      name: { vi: 'Khuôn viên ngoài trời', en: 'Outdoor grounds', ja: '屋外（前庭）', ko: '야외 부지', zh: '室外场地' } },
    };

    let lang = 'vi';
    let languages = [{ code: 'vi', label: 'Tiếng Việt', speech: 'vi-VN' }];
    let artifacts = [];
    let areaFilter = 'all';
    let current = null;
    let playing = false;

    const S = () => STRINGS[lang] || STRINGS.vi;
    const areaName = (slug) => (AREAS[slug] ? AREAS[slug].name[lang] || AREAS[slug].name.vi : S().all);
    const speechOf = (code) => (languages.find((l) => l.code === code) || { speech: 'vi-VN' }).speech;

    // ---------- Vẽ giao diện tĩnh theo ngôn ngữ ----------
    function applyStatic() {
      const s = S();
      document.documentElement.lang = lang;
      document.title = 'Dinh Độc Lập – ' + s.brandSub;
      const set = (id, text) => { document.getElementById(id).textContent = text; };
      set('brandSub', s.brandSub); set('heroKicker', s.kicker); set('heroTitle', s.heroTitle);
      set('heroDesc', s.heroDesc); set('heroHint', s.heroHint); set('listTitle', s.listTitle);
      document.getElementById('search').placeholder = s.search;
      set('tabAudio', s.tabAudio); set('tabQr', s.tabQr); set('detailLink', s.detail);
      set('playText', s.listen); set('stopText', s.stop); set('qrHint', s.qrHint);
      set('qrBaseLabel', s.qrBase); set('qrWarn', s.qrWarn); set('footDesc', s.heroDesc);
      set('footHowTitle', s.footHowTitle); set('footHow', s.footHow);
      set('footProjTitle', s.footProjTitle); set('footProj', s.footProj); set('footCopy', s.copy);
      document.getElementById('qrBase').placeholder = 'http://192.168.1.10:5000';
      set('siteQrTitle', s.siteQrTitle); set('siteQrDesc', s.siteQrDesc); set('siteBaseLabel', s.siteBaseLabel);
      set('siteWarn', s.siteWarn); set('siteDownload', s.siteDownload);
      updateSiteQr();
    }

    // ---------- Khu vực (chip lọc) ----------
    function renderAreaChips() {
      const box = document.getElementById('areaChips');
      box.replaceChildren();
      document.getElementById('areaTitle').textContent = S().areaTitle;
      const used = [...new Set(artifacts.map((a) => a.categorySlug).filter((slug) => AREAS[slug]))];
      const order = Object.keys(AREAS).filter((slug) => used.includes(slug));
      const countOf = (slug) => (slug === 'all' ? artifacts.length : artifacts.filter((a) => a.categorySlug === slug).length);
      const items = [['all', S().all], ...order.map((slug) => [slug, areaName(slug)])];
      items.forEach(([slug, label]) => {
        const active = areaFilter === slug;
        const b = el('button', 'flex items-center justify-between gap-3 px-4 py-2.5 rounded-xl border text-sm transition lg:w-full ' +
          (active ? 'chip-active' : 'border-heritage-brown/25 bg-white text-heritage-ink hover:border-heritage-red'));
        b.type = 'button';
        b.append(el('span', 'text-left', label), el('span', 'text-xs font-bold px-2 py-0.5 rounded-full ' +
          (active ? 'bg-white/20' : 'bg-heritage-paper text-heritage-brown'), String(countOf(slug))));
        b.addEventListener('click', () => { areaFilter = slug; renderAreaChips(); renderGrid(); });
        box.append(b);
      });
    }

    // ---------- Lưới công trình ----------
    function visibleItems() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      return artifacts.filter((a) =>
        (areaFilter === 'all' || a.categorySlug === areaFilter) &&
        (!q || (a.name || '').toLowerCase().includes(q) || (a.code || '').toLowerCase().includes(q)));
    }

    function makeCard(a) {
      const area = AREAS[a.categorySlug];
      const card = el('article', 'card bg-white rounded-2xl overflow-hidden border border-heritage-gold/30 flex flex-col');

      // Band: hiển thị ảnh thực nếu có imageUrl, fallback về icon gradient
      const band = el('div', 'img-band relative h-44 overflow-hidden flex items-center justify-center');
      if (a.imageUrl) {
        const img = document.createElement('img');
        img.src = a.imageUrl;
        img.alt = a.name;
        img.className = 'absolute inset-0 w-full h-full object-cover';
        img.loading = 'lazy';
        // Fallback về icon nếu ảnh lỗi
        img.addEventListener('error', () => {
          img.remove();
          band.append(icon(`fa-solid ${area ? area.icon : 'fa-landmark'} text-5xl text-heritage-goldSoft/70`));
        });
        // Overlay tối nhẹ để badge đọc được
        const overlay = el('div', 'absolute inset-0 bg-gradient-to-t from-heritage-redDeep/60 via-transparent to-transparent');
        band.append(img, overlay);
      } else {
        band.append(icon(`fa-solid ${area ? area.icon : 'fa-landmark'} text-5xl text-heritage-goldSoft/80`));
      }
      band.append(el('span', 'absolute top-3 left-3 text-[11px] font-bold tracking-wider bg-white/90 text-heritage-red px-2.5 py-1 rounded-full z-10', a.code));
      if (a.fallback) band.append(el('span', 'absolute top-3 right-3 text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full z-10', '!'));

      const body = el('div', 'p-6 flex-1 flex flex-col');
      const title = el('h4', 'font-serif text-xl font-bold text-heritage-red mb-1', a.name);
      const where = el('p', 'text-sm text-heritage-brown mb-3 flex items-center gap-2');
      where.append(icon('fa-solid fa-location-dot text-heritage-gold'), document.createTextNode(a.location || ''));
      const desc = el('p', 'text-sm leading-relaxed text-heritage-ink/80 line-clamp-3 mb-5', a.description || '');
      const btn = el('button', 'mt-auto w-full bg-heritage-red hover:bg-heritage-redDeep text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2');
      btn.type = 'button';
      btn.append(icon('fa-solid fa-headphones'), document.createTextNode(S().listen));
      btn.addEventListener('click', () => openModal(a));

      body.append(title, where, desc, btn);
      card.append(band, body);
      return card;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const items = visibleItems();
      grid.replaceChildren();
      document.getElementById('listCount').textContent = S().count(items.length);
      document.getElementById('empty').classList.toggle('hidden', items.length > 0);
      document.getElementById('emptyText').textContent = S().empty;

      // Nhóm theo khu vực theo đúng thứ tự tầng: trệt -> lầu 1 -> lầu 2 -> sân thượng -> hầm -> ngoài trời
      const order = Object.keys(AREAS);
      const groups = new Map();
      items.forEach((a) => {
        const key = AREAS[a.categorySlug] ? a.categorySlug : 'khac';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(a);
      });
      const rank = (k) => (order.indexOf(k) < 0 ? 99 : order.indexOf(k));
      [...groups.keys()].sort((x, y) => rank(x) - rank(y)).forEach((key) => {
        const list = groups.get(key);
        const area = AREAS[key];
        const section = el('section', 'mb-12 scroll-mt-28');
        section.id = 'area-' + key;
        const head = el('div', 'flex items-center gap-3 mb-6 pb-3 border-b border-heritage-gold/50');
        head.append(
          el('div', 'w-10 h-10 rounded-full bg-heritage-red text-heritage-goldSoft flex items-center justify-center'),
          el('h4', 'font-serif text-2xl font-bold text-heritage-red', area ? area.name[lang] || area.name.vi : S().other),
          el('span', 'ml-auto text-sm text-heritage-brown', S().count(list.length)));
        head.firstChild.append(icon(`fa-solid ${area ? area.icon : 'fa-landmark'}`));
        const row = el('div', 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-7');
        list.forEach((a) => row.append(makeCard(a)));
        section.append(head, row);
        grid.append(section);
      });
    }

    // ---------- Modal ----------
    function openModal(a) {
      current = a;
      stopSpeech(); playing = false; setPlayIcon();
      const s = S();
      document.getElementById('mCode').textContent = a.code;
      document.getElementById('mArea').replaceChildren(icon('fa-solid fa-layer-group'), document.createTextNode(' ' + areaName(a.categorySlug)));
      document.getElementById('mTitle').textContent = a.name;
      document.getElementById('mLocation').replaceChildren(icon('fa-solid fa-location-dot text-heritage-gold'), document.createTextNode(' ' + (a.location || '')));
      document.getElementById('mDesc').textContent = a.description || '';
      const fb = document.getElementById('mFallback');
      fb.textContent = s.fallback; fb.classList.toggle('hidden', !a.fallback);
      document.getElementById('detailLink').href = `detail.html?code=${encodeURIComponent(a.code)}&lang=${lang}`;
      document.getElementById('speechNote').classList.add('hidden');
      showTab('audio');
      updateQr();
      const m = document.getElementById('modal');
      m.classList.remove('hidden'); m.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      stopSpeech();
      const m = document.getElementById('modal');
      m.classList.add('hidden'); m.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function showTab(which) {
      const audio = which === 'audio';
      document.getElementById('viewAudio').classList.toggle('hidden', !audio);
      document.getElementById('viewQr').classList.toggle('hidden', audio);
      const tA = document.getElementById('tabAudio'), tQ = document.getElementById('tabQr');
      tA.className = 'pb-2 font-semibold text-sm border-b-2 ' + (audio ? 'border-heritage-red text-heritage-red' : 'border-transparent text-heritage-brown hover:text-heritage-red');
      tQ.className = 'pb-2 font-semibold text-sm border-b-2 ' + (!audio ? 'border-heritage-red text-heritage-red' : 'border-transparent text-heritage-brown hover:text-heritage-red');
    }

    function qrBase() {
      const raw = document.getElementById('qrBase').value.trim() || window.location.origin;
      try { return new URL(raw).origin; } catch (e) { return window.location.origin; }
    }

    function updateQr() {
      if (!current) return;
      const base = qrBase();
      document.getElementById('qrImg').src = `/api/artifacts/code/${encodeURIComponent(current.code)}/qr?base=${encodeURIComponent(base)}`;
      document.getElementById('qrWarn').classList.toggle('hidden', !/localhost|127\.0\.0\.1/.test(base));
    }

    // Mã QR của trang web: du khách quét để mở trang này trên điện thoại của họ
    function updateSiteQr() {
      const raw = document.getElementById('siteBase').value.trim() || window.location.origin;
      let base; try { base = new URL(raw).origin; } catch (e) { base = window.location.origin; }
      const src = `/api/site/qr?base=${encodeURIComponent(base)}`;
      document.getElementById('siteQrImg').src = src;
      document.getElementById('siteDownload').href = src;
      document.getElementById('siteWarn').classList.toggle('hidden', !/localhost|127\.0\.0\.1/.test(base));
    }

    function setPlayIcon() {
      const i = document.getElementById('playIcon');
      i.className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    }

    function togglePlay() {
      if (!current) return;
      if (playing) { stopSpeech(); playing = false; setPlayIcon(); return; }
      const ok = speak(current.description || '', speechOf(current.language || lang));
      if (!ok) { const n = document.getElementById('speechNote'); n.textContent = S().noSpeech; n.classList.remove('hidden'); return; }
      playing = true; setPlayIcon();
      // Ghi nhận lượt nghe (ẩn danh), lỗi bị bỏ qua
      trackEvent(current.code, current.language || lang, 'play');
      const u = window.speechSynthesis;
      const check = setInterval(() => { if (!u.speaking && !u.pending) { playing = false; setPlayIcon(); clearInterval(check); } }, 400);
    }

    // ---------- Dữ liệu ----------
    async function loadLanguages() {
      try { languages = (await fetchJson('/api/languages')).data; } catch (e) { /* giữ mặc định */ }
      renderLangBar();
    }

    function renderLangBar() {
      renderLanguageButtons(document.getElementById('langBar'), languages, lang, changeLanguage, 'text-xs');
    }

    async function loadArtifacts() {
      const status = document.getElementById('status');
      status.textContent = S().loading; status.classList.remove('hidden');
      try {
        const body = await fetchJson(`/api/artifacts?lang=${lang}`);
        artifacts = body.data || [];
        status.classList.add('hidden');
      } catch (err) {
        artifacts = [];
        status.textContent = S().error + ': ' + err.message;
        status.classList.remove('hidden');
      }
      renderAreaChips();
      renderGrid();
    }

    async function changeLanguage(code) {
      lang = code;
      storeLang(lang);
      applyStatic();
      renderLangBar();
      renderAreaChips();
      await loadArtifacts();
      // Nếu đang mở khung chi tiết, làm mới bằng dữ liệu của ngôn ngữ mới
      const modalOpen = !document.getElementById('modal').classList.contains('hidden');
      if (modalOpen && current) {
        const fresh = artifacts.find((a) => a.code === current.code);
        if (fresh) openModal(fresh);
      }
    }

    // ---------- Khởi động ----------
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
      document.getElementById('tabAudio').addEventListener('click', () => showTab('audio'));
      document.getElementById('tabQr').addEventListener('click', () => { showTab('qr'); updateQr(); });
      document.getElementById('playBtn').addEventListener('click', togglePlay);
      document.getElementById('stopBtn').addEventListener('click', () => { stopSpeech(); playing = false; setPlayIcon(); });
      document.getElementById('qrBase').addEventListener('input', updateQr);
      document.getElementById('search').addEventListener('input', renderGrid);
      document.getElementById('siteBase').addEventListener('input', updateSiteQr);
      const qrImg = document.getElementById('siteQrImg');
      qrImg.addEventListener('error', () => { const e = document.getElementById('siteQrError'); e.textContent = S().siteQrError; e.classList.remove('hidden'); });
      qrImg.addEventListener('load', () => document.getElementById('siteQrError').classList.add('hidden'));

      await loadLanguages();
      lang = detectLanguage(languages.map((l) => l.code));
      applyStatic();
      renderLangBar();
      document.getElementById('qrBase').value = window.location.origin;
      document.getElementById('siteBase').value = window.location.origin;
      loadArtifacts();
    });
  </script>
</body>
</html>
