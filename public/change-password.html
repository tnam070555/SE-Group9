<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu – Dinh Độc Lập</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        brand: { 500: '#C9A227', 600: '#8B1E24', 700: '#6d1a1f', 800: '#5E1216' },
                        sidebar: '#2A2320',
                    }
                }
            }
        }
    </script>

    <script src="/js/auth.js"></script>
    <script>
        // Chưa đăng nhập thì không đổi được mật khẩu -> về trang đăng nhập
        if (window.Auth && !Auth.isLoggedIn()) {
            location.replace('/login.html?next=' + encodeURIComponent('/admin'));
        }
    </script>

    <style>
        body {
            background-color: #2A2320;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(201, 162, 39, .14), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(139, 30, 36, .35), transparent 50%);
        }
        .gold-rule { height: 3px; background: linear-gradient(90deg, transparent, #C9A227, transparent); }
    </style>
</head>

<body class="font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-full border-2 border-brand-500 bg-white/95 text-brand-600 flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
            <h1 class="font-serif text-2xl font-bold text-white uppercase tracking-wide">Đổi mật khẩu</h1>
            <p class="text-sm text-brand-500 mt-1 tracking-widest uppercase" id="who">Khu vực quản trị</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="gold-rule"></div>

            <form id="change-form" class="p-8" novalidate>
                <!-- Mật khẩu hết hạn -->
                <div id="expired-note" class="hidden mb-5 flex items-start gap-3 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
                    <i class="fa-solid fa-clock mt-0.5"></i>
                    <span>Mật khẩu đã quá <b>24 giờ</b> chưa đổi. Vui lòng đặt mật khẩu mới để tiếp tục vào trang quản trị.</span>
                </div>
                <p id="normal-note" class="text-sm text-slate-500 mb-6">Mật khẩu phải đổi định kỳ mỗi 24 giờ. <span id="expires-in"></span></p>

                <!-- Thông báo lỗi -->
                <div id="form-error" class="hidden mb-5 flex items-start gap-3 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert" aria-live="polite">
                    <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                    <span id="form-error-text"></span>
                </div>

                <label for="current" class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu hiện tại</label>
                <input id="current" type="password" autocomplete="current-password" required autofocus
                       class="w-full mb-5 px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition">

                <label for="new" class="block text-sm font-medium text-slate-700 mb-1.5">Mật khẩu mới <span class="text-slate-400 font-normal">(ít nhất 8 ký tự)</span></label>
                <input id="new" type="password" autocomplete="new-password" required minlength="8"
                       class="w-full mb-5 px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition">

                <label for="confirm" class="block text-sm font-medium text-slate-700 mb-1.5">Nhập lại mật khẩu mới</label>
                <input id="confirm" type="password" autocomplete="new-password" required
                       class="w-full mb-3 px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25 transition">

                <label class="flex items-center gap-2 text-sm text-slate-500 mb-6 cursor-pointer select-none">
                    <input type="checkbox" id="show" class="accent-brand-600"> Hiện mật khẩu
                </label>

                <button type="submit" id="submit-btn"
                        class="w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition disabled:opacity-60 disabled:cursor-not-allowed">
                    <span id="submit-label">Đổi mật khẩu</span>
                    <i id="submit-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>

            <div class="px-8 pb-6 -mt-2 flex justify-between text-sm">
                <a href="/admin" id="back-link" class="text-slate-500 hover:text-brand-600 transition inline-flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left text-xs"></i> Về trang quản trị
                </a>
                <button type="button" onclick="Auth.logout()" class="text-slate-500 hover:text-rose-600 transition inline-flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i> Đăng xuất
                </button>
            </div>
        </div>
    </main>

    <script>
        var params = new URLSearchParams(location.search);
        var next = params.get('next');
        // Chỉ chấp nhận đường dẫn nội bộ, tránh bị chuyển sang web khác
        var safeNext = (next && next.charAt(0) === '/' && next.charAt(1) !== '/') ? next : '/admin';

        var form = document.getElementById('change-form');
        var currentInput = document.getElementById('current');
        var newInput = document.getElementById('new');
        var confirmInput = document.getElementById('confirm');
        var submitBtn = document.getElementById('submit-btn');
        var submitLabel = document.getElementById('submit-label');
        var submitSpinner = document.getElementById('submit-spinner');

        function showError(message) {
            document.getElementById('form-error-text').textContent = message;
            document.getElementById('form-error').classList.remove('hidden');
        }
        function hideError() { document.getElementById('form-error').classList.add('hidden'); }
        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitLabel.textContent = loading ? 'Đang lưu...' : 'Đổi mật khẩu';
            submitSpinner.classList.toggle('hidden', !loading);
        }

        // Mật khẩu đã hết hạn: ẩn link "Về trang quản trị" (vào cũng bị đẩy lại đây)
        var expired = window.Auth && Auth.isPasswordExpired();
        if (expired || params.get('expired') === '1') {
            document.getElementById('expired-note').classList.remove('hidden');
            document.getElementById('normal-note').classList.add('hidden');
        }
        if (expired) document.getElementById('back-link').classList.add('invisible');

        if (window.Auth) {
            var admin = Auth.getAdmin();
            if (admin && admin.username) document.getElementById('who').textContent = 'Tài khoản: ' + admin.username;
            var exp = Auth.passwordExpiresAt();
            if (exp && !expired) {
                document.getElementById('expires-in').textContent =
                    'Mật khẩu hiện tại hết hạn lúc ' + exp.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) + '.';
            }
        }

        document.getElementById('show').addEventListener('change', function () {
            var type = this.checked ? 'text' : 'password';
            currentInput.type = newInput.type = confirmInput.type = type;
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            hideError();

            var current = currentInput.value;
            var fresh = newInput.value;
            if (!current || !fresh) return showError('Vui lòng nhập đầy đủ mật khẩu hiện tại và mật khẩu mới.');
            if (fresh.length < 8) return showError('Mật khẩu mới cần ít nhất 8 ký tự.');
            if (fresh !== confirmInput.value) return showError('Hai lần nhập mật khẩu mới không khớp.');
            if (fresh === current) return showError('Mật khẩu mới phải khác mật khẩu hiện tại.');

            setLoading(true);
            try {
                var result = await Auth.changePassword(current, fresh);
                if (!result.ok) {
                    showError(result.message);
                    currentInput.focus();
                    return;
                }
                location.replace(safeNext);
            } catch (err) {
                console.error(err);
                showError('Có lỗi không mong muốn: ' + (err && err.message ? err.message : err));
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
